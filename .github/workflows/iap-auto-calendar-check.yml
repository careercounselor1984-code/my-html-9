name: IAP automatic calendar link checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check clients.js
          node tests/iap-auto-calendar-receiver.test.cjs
