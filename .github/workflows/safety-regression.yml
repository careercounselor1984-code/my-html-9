name: Schedule safety regression
on:
  push:
    branches:
      - "fix/schedule-safety-20261011"
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check safety regression
        run: |
          node tests/schedule-safety.test.cjs
          node tests/desktop-mini.test.cjs
          node tests/energy-alert-once.test.cjs
          node tests/daily-layout-alert-scope.test.cjs
          node tests/private-planner.test.cjs
          node tests/clients.test.cjs

      - name: Headless Chrome initial-screen smoke (unauthenticated)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "Chrome not found on GitHub runner"; exit 1; }
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 --dump-dom "file://$GITHUB_WORKSPACE/index.html" > /tmp/goodjob-screen.html 2>/tmp/goodjob-chrome.log
          grep -Fq 'cloudGate' /tmp/goodjob-screen.html
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 --dump-dom "file://$GITHUB_WORKSPACE/index.html?mini=1" > /tmp/goodjob-mini.html 2>/tmp/goodjob-mini-chrome.log
          grep -Fq "desktopMiniRoot" /tmp/goodjob-mini.html
          grep -Fq "cloudGate" /tmp/goodjob-mini.html
          echo "Headless Chrome standard and mini screens loaded (unauthenticated); authenticated tests still required"
