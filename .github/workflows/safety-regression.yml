name: Schedule safety regression
on:
  push:
    branches:
      - "fix/schedule-safety-20261011"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check safety regression
        run: node tests/schedule-safety.test.cjs

      - name: Headless Chrome initial-screen smoke (unauthenticated)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "Chrome not found on GitHub runner"; exit 1; }
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 --dump-dom "file://$GITHUB_WORKSPACE/index.html" > /tmp/goodjob-screen.html 2>/tmp/goodjob-chrome.log
          grep -Fq 'cloudGate' /tmp/goodjob-screen.html
          echo "Headless Chrome DOM loaded successfully (not a substitute for authenticated testing)"
