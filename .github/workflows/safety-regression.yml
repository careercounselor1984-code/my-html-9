name: Schedule safety regression
on:
  push:
    branches:
      - "fix/schedule-safety-20261011"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check safety regression
        run: node tests/schedule-safety.test.cjs
