name: Schedule safety regression
on:
  push:
    branches:
      - "fix/schedule-safety-20261011"
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check safety regression
        run: |
          node tests/schedule-safety.test.cjs
          node tests/consult-kakao.test.cjs
          node tests/desktop-mini.test.cjs
          node tests/notification-policy.test.cjs
          node tests/energy-alert-once.test.cjs
          node tests/daily-layout-alert-scope.test.cjs
          node tests/visitor-output.test.cjs
          node tests/private-planner.test.cjs
          node tests/client-import.test.cjs
          node tests/clients.test.cjs
          node tests/client-deadlines.test.cjs
          node tests/client-date-types.test.cjs
          node tests/schedule-work-blocks.test.cjs
          node tests/work-menus.test.cjs
          node tests/work-periods.test.cjs
          node tests/task-model.test.cjs
          node tests/task-dispatch.test.cjs
          node tests/client-lifecycle.test.cjs
          node tests/session-lifecycle.test.cjs
          node tests/task-reminder-session.test.cjs
          node tests/full-runtime-browser-smoke.cjs
          node tests/calendar-workspace-browser-smoke.cjs
          node tests/private-screens-browser-smoke.cjs

      - name: Verify client import with actual DOM
        run: |
          npm install --prefix /tmp/client-import-test jsdom@30.1.2 --no-audit --no-fund
          NODE_PATH=/tmp/client-import-test/node_modules node tests/client-xlsx.test.cjs
          NODE_PATH=/tmp/client-import-test/node_modules node tests/client-import-dom.test.cjs
          NODE_PATH=/tmp/client-import-test/node_modules node tests/client-deadlines-dom.test.cjs
          NODE_PATH=/tmp/client-import-test/node_modules node tests/client-auto-background.test.cjs

      - name: Headless Chrome offline initial-screen smoke (unauthenticated)
        run: node tests/offline-browser-smoke.cjs
